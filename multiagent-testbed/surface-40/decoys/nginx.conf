worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 15;
    server_tokens off;

    # 31 NeuraSaaS — brand-only AI landing
    server {
        listen 3031;
        server_name _;
        root /sites/31-neurasaas;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }

    # 32 Scripted SmartBot — chat UI, canned JS, no model
    server {
        listen 3032;
        server_name _;
        root /sites/32-smartbot;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }

    # 33 Human "we'll reply" support
    server {
        listen 3033;
        server_name _;
        root /sites/33-human-support;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }

    # 34 Fake LLM SDK site — passive strings only
    server {
        listen 3034;
        server_name _;
        root /sites/34-fake-sdk;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }

    # 35 Canned /api/chat — looks like inference, returns a fixed string
    server {
        listen 3035;
        server_name _;
        root /sites/35-canned-api;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /api/chat {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "content-type,authorization";
            if ($request_method = OPTIONS) { return 204; }
            return 200 '{"id":"chatcmpl-decoy","object":"chat.completion","created":1700000000,"model":"decoy-not-a-model","choices":[{"index":0,"message":{"role":"assistant","content":"Canned string. No weights were loaded and no tokens were generated."},"finish_reason":"stop"}],"usage":{"prompt_tokens":0,"completion_tokens":0,"total_tokens":0}}';
        }

        location = /v1/chat/completions {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            if ($request_method = OPTIONS) { return 204; }
            return 200 '{"id":"chatcmpl-decoy","object":"chat.completion","choices":[{"message":{"role":"assistant","content":"Canned string. No model."}}]}';
        }

        location = /v1/models {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"object":"list","data":[{"id":"decoy-not-a-model","object":"model","owned_by":"nobody"}]}';
        }
    }

    # 36 AI-branded docs site — heavy GPT/AI copy, no surface
    server {
        listen 3036;
        server_name _;
        root /sites/36-ai-docs;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }
    }
}
