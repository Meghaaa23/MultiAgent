services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: benchmark-anythingllm

    restart: unless-stopped

    ports:
      - "3101:3001"

    environment:
      STORAGE_DIR: /app/server/storage

    volumes:
      - ./storage:/app/server/storage

    extra_hosts:
      - "host.docker.internal:host-gateway"
