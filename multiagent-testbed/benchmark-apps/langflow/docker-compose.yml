services:
  langflow:
    image: langflowai/langflow:latest
    container_name: benchmark-langflow

    restart: unless-stopped

    ports:
      - "7860:7860"

    environment:
      LANGFLOW_AUTO_LOGIN: "false"

    volumes:
      - ./data:/app/langflow

    extra_hosts:
      - "host.docker.internal:host-gateway"
