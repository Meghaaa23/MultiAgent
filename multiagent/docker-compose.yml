# ============================================================================
# docker-compose.yml - Multi-Agent Threat Modeling System
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Main Application
  # --------------------------------------------------------------------------
  multiagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiagent:latest
    container_name: multiagent-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # --------------------------------------------------------------------------
  # Redis - Caching & Agent State Management
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: multiagent-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local