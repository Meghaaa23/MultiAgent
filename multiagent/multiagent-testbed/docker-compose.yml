  jupyter:
    image: jupyter/base-notebook:latest
    container_name: tb-jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: "jupyter"
    ports:
      - "8026:8888"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.46
    labels:
      testbed.group: "ai-ml"
      testbed.app: "jupyter"
      testbed.port: "8026"
      testbed.vulns: "rce,ssrf,token-exposure,unauthenticated-access"

  labelstudio:
    image: heartexlabs/label-studio:latest
    container_name: tb-labelstudio
    restart: unless-stopped
    ports:
      - "8027:8080"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.47
    labels:
      testbed.group: "ai-ml"
      testbed.app: "labelstudio"
      testbed.port: "8027"
      testbed.vulns: "ssrf,idor,broken-auth,sensitive-data"

# ─────────────────────────────────────────
# GROUP 7 — LEGACY  (8028–8029)
# ─────────────────────────────────────────

  solr:
    image: solr:8.11
    container_name: tb-solr
    restart: unless-stopped
    ports:
      - "8028:8983"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.48
    labels:
      testbed.group: "legacy"
      testbed.app: "solr"
      testbed.port: "8028"
      testbed.vulns: "rce,ssrf,log4shell,unauthenticated-access"

  struts:
    image: vulhub/struts2:s2-053
    container_name: tb-struts
    restart: unless-stopped
    ports:
      - "8029:8080"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.49
    labels:
      testbed.group: "legacy"
      testbed.app: "struts"
      testbed.port: "8029"
      testbed.vulns: "rce,ognl-injection,s2-045,s2-057"

# ─────────────────────────────────────────
# GROUP 8 — DEVTOOLS  (8030)
# ─────────────────────────────────────────

  jenkins:
    image: jenkins/jenkins:lts
    container_name: tb-jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    ports:
      - "8030:8080"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.50
    labels:
      testbed.group: "devtools"
      testbed.app: "jenkins"
      testbed.port: "8030"
      testbed.vulns: "rce,ssrf,groovy-script-exec,credential-exposure,csrf"

# ─────────────────────────────────────────
# GROUP 9 — CLOUD NATIVE  (8031–8032)
# ─────────────────────────────────────────

  portainer:
    image: portainer/portainer-ce:latest
    container_name: tb-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8031:9000"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.51
    labels:
      testbed.group: "cloud-native"
      testbed.app: "portainer"
      testbed.port: "8031"
      testbed.vulns: "container-escape,privilege-escalation,ssrf,broken-auth"

  minio:
    image: minio/minio:latest
    container_name: tb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "8032:9001"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.52
    labels:
      testbed.group: "cloud-native"
      testbed.app: "minio"
      testbed.port: "8032"
      testbed.vulns: "misconfigured-bucket,idor,path-traversal,unauthenticated-access"

# ─────────────────────────────────────────
# GROUP 10 — MICROSERVICES  (8033–8035)
# ─────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "8033:15672"
    networks:
      testbed-net:
        ipv4_address: 172.30.0.53
    labels:
      testbed.group: "microservices"
      testbed.app: "rabbitmq"
      testbed.port: "8033"
