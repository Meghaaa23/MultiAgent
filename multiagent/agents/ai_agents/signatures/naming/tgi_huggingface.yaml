id: tgi_huggingface
requires_live_surface: true
meta:
  name: TGI (HuggingFace)
  capabilities:
  - chat
  - embedding
detection:
  paths:
  - path: /generate
    category: chat
  - path: /generate_stream
    category: chat
  - path: /v1/chat/completions
    category: chat
  headers:
    server: text-generation-inference
  body_patterns:
  - '"generated_text"'
  - '"details".*"finish_reason"'
