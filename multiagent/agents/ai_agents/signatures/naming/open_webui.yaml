id: open_webui
requires_live_surface: true
meta:
  name: Open WebUI
  capabilities:
  - chat
  - rag
  - tool_calling
  - image_generation
  - web_search
detection:
  paths:
  - path: /api/models
    category: schema
  - path: /api/v1/models
    category: schema
  - path: /api/chat
    category: chat
  - path: /api/chat/completions
    category: chat
  - path: /api/v1/chat/completions
    category: chat
  - path: /ollama/api/tags
    category: schema
  - path: /api/v1/auths
    category: schema
  headers:
    x-open-webui: .*
  js_strings:
  - open-webui
  - OpenWebUI
  - open webui
  - webui-logo
  - Open WebUI
  js_globals:
  - WEBUI_NAME
  - WEBUI_URL
  cookie_names:
  - webui-session
  - token
  title_hints:
  - open webui
  - openwebui
