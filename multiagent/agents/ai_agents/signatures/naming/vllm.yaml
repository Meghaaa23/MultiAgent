id: vllm
requires_live_surface: true
meta:
  name: vLLM
  capabilities:
  - chat
  - embedding
detection:
  paths:
  - path: /v1/chat/completions
    category: chat
  - path: /v1/completions
    category: chat
  - path: /v1/models
    category: schema
  headers:
    server: vllm
  body_patterns:
  - '"object"\s*:\s*"chat\.completion"'
