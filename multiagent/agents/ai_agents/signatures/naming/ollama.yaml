id: ollama
requires_live_surface: true
meta:
  name: Ollama
  capabilities:
  - chat
  - embedding
detection:
  paths:
  - path: /api/tags
    category: schema
  - path: /api/chat
    category: chat
  - path: /api/generate
    category: chat
  - path: /api/version
    category: schema
  - path: /api/show
    category: schema
  - path: /v1/chat/completions
    category: chat
  - path: /v1/models
    category: schema
  headers:
    x-ollama-version: .*
  js_strings:
  - ollama
  - Ollama
  body_patterns:
  - '"done_reason"'
  - '"total_duration"'
  - '"eval_count"'
