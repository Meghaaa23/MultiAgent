id: chat_inference
class: live_surface
meta:
  name: Generic chat inference API
  capabilities: [chat]
detection:
  paths:
    - {path: /api/chat, category: chat}
    - {path: /api/generate, category: chat}
    - {path: /api/ask, category: chat}
    - {path: /api/messages, category: chat}
    - {path: /api/v1/prediction, category: chat}
    - {path: /api/v1/run, category: chat}
    - {path: /api/v1/openai/chat/completions, category: chat}
    - {path: /api/chat-messages, category: chat}
    - {path: /api/agents, category: chat}
    - {path: /api/predict, category: ml}
    - {path: /predict, category: ml}
    - {path: /invocations, category: ml}
    - {path: /predictions, category: ml}
    - {path: /runs, category: chat}
    - {path: /threads, category: chat}
    - {path: /queue/join, category: chat}
    - {path: /run/predict, category: chat}
    - {path: /call/predict, category: chat}
    - {path: /generate, category: chat}
    - {path: /generate_stream, category: chat}
    - {path: /api/workflows/run, category: chat}
  body_patterns:
    - '"response"\s*:'
    - '"message"\s*:'
    - '"generated_text"'
    - '"done"\s*:\s*(?:true|false)'
