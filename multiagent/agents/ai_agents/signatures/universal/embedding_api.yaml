id: embedding_api
class: live_surface
meta:
  name: Embedding API
  capabilities: [embedding]
detection:
  paths:
    - {path: /v1/embeddings, category: embedding}
    - {path: /api/embeddings, category: embedding}
    - {path: /api/embed, category: embedding}
  body_patterns:
    - '"embeddings"\s*:'
    - '"embedding"\s*:'
    - '"data"\s*:\s*\['
